<div class="scene" aria-label="Luis's island. Select a building to zoom in.">
  <div class="world terrain-world" [style.transform]="worldTransform()">
    <div class="open-sea" aria-hidden="true"
         [style.left.px]="ground.centerX * scale() - seaRadius()" [style.top.px]="ground.centerY * scale() - seaRadius()"
         [style.width.px]="seaRadius() * 2" [style.height.px]="seaRadius() * 2"></div>
    <img class="ground" [src]="ground.src" alt=""
         [style.width.px]="ground.w * scale()" [style.height.px]="ground.h * scale()" draggable="false">
  </div>

  <div class="world mountain-world" [style.transform]="mountainTransform()" [style.--tilt]="tilt + 'deg'">
    @if (mountain(); as m) {
      <img class="mountain-sprite" [src]="m.src" alt="" draggable="false"
           [style.left.px]="m.left" [style.top.px]="m.top" [style.width.px]="m.w" [style.height.px]="m.h"
           [style.transform-origin]="m.origin">
    }
  </div>

  <div class="world objects-world" [style.transform]="worldTransform()" [style.--tilt]="tilt + 'deg'">
    @for (s of sprites(); track s.id) {
      @if (s.landmark; as l) {
        <button type="button" class="billboard landmark" [class.boat-link]="s.id === 'boat'"
                [style.left.px]="s.left" [style.top.px]="s.top" [style.width.px]="s.w" [style.height.px]="s.h" [style.transform-origin]="s.origin"
                [attr.aria-label]="l.name + ': ' + l.place" (click)="pick(s)">
          <img [src]="s.src" alt="" draggable="false">
          <span class="tag">{{ l.name }}</span>
        </button>
      } @else {
        <img class="billboard" [src]="s.src" alt="" draggable="false"
             [style.left.px]="s.left" [style.top.px]="s.top" [style.width.px]="s.w" [style.height.px]="s.h" [style.transform-origin]="s.origin">
      }
    }
  </div>
</div>

<p class="hint" [class.gone]="hintGone()" aria-hidden="true">CLICK A HOUSE TO ZOOM</p>
